<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Calculadora de IMC</h1>
    <p class="small">Informe seu peso e altura.</p>

    <label for="peso">Peso (kg)</label>
    <input id="peso" type="number" step="0.1" placeholder="Ex: 72.5">

    <label for="altura">Altura (m)</label>
    <input id="altura" type="number" step="0.01" placeholder="Ex: 1.75">

    <button id="calcular">Calcular IMC</button>

    <div id="saida" class="resultado" style="display: none;"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
